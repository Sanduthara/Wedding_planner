<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ethereal Weddings</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .login-container {
            display: flex;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            width: 900px;
            max-width: 95%;
            min-height: 600px;
        }

        .login-brand {
            flex: 1;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: #fff;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .login-brand::after {
            content: 'E';
            position: absolute;
            bottom: -50px;
            right: -20px;
            font-size: 300px;
            font-family: 'Playfair Display', serif;
            opacity: 0.05;
        }
        .login-form-area {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="fade-in">

    <div class="login-container">
        <div class="login-brand">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1 class="brand-font" style="font-size: 3rem; color: var(--primary);">Ethereal</h1>
                <h2 class="brand-font" style="font-size: 1.5rem; margin-bottom: 1.5rem;">Weddings</h2>
            </a>
            <p style="font-size: 1.1rem; opacity: 0.8;">Refined planning for your most precious moments.</p>
        </div>

        <div class="login-form-area">
            <h2 class="mb-2">Customer Sign In</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="identifier">Username or email</label>
                    <input type="text" id="identifier" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100" style="width: 100%;" id="loginBtn">Sign In</button>
            </form>

            <div class="mt-2 text-center">
                <p class="text-muted">Don't have an account? <a href="customer/register.html" class="text-primary">Register here</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const identifierInput = document.getElementById('identifier');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = identifierInput.value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            utils.setLoading(loginBtn, true, 'Signing In...');

            try {
                const response = await api.post('/auth/customer/login', {
                    username: identifier, // Backend LoginRequestDTO uses 'username' field for both email/username
                    password: password
                }, false);

                const sessionData = {
                    id: response.user.id,
                    name: response.user.name,
                    email: response.user.email,
                    role: response.role.replace('ROLE_', ''), // Convert ROLE_ADMIN -> ADMIN
                    token: response.token
                };

                localStorage.setItem('ethereal_user', JSON.stringify(sessionData));
                
                showToast(`Welcome back, ${sessionData.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = 'customer/bookings.html';
                }, 1000);

            } catch (error) {
                showToast(error.message || 'Invalid credentials', 'error');
            } finally {
                utils.setLoading(loginBtn, false, 'Sign In');
            }
        });
    </script>
</body>
</html>
