<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="sidebar-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="events.html" class="sidebar-item active" data-page="events">
                    <i class="fas fa-calendar-alt"></i> My Events
                </a>
                <a href="packages.html" class="sidebar-item" data-page="packages">
                    <i class="fas fa-box-open"></i> Browse Packages
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-clipboard-list"></i> My Bookings
                </a>
                <a href="payments.html" class="sidebar-item" data-page="payments">
                    <i class="fas fa-wallet"></i> My Payments
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">My Events</h2>
                <button id="addEventBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Plan New Event
                </button>
            </header>

            <div id="eventsGrid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
                <!-- Event cards will be injected here -->
            </div>
        </main>
    </div>

    <!-- Add Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-card">
            <h3 class="brand-font mb-2" id="modalTitle">Plan New Event</h3>
            <form id="eventForm">
                <div class="form-group">
                    <label class="form-label">Event Name</label>
                    <input type="text" id="eventName" class="form-control" placeholder="e.g. Dream Wedding Reception"
                        required>
                </div>
                <div class="form-group">
                    <label class="form-label">Event Type</label>
                    <select id="eventType" class="form-control" required>
                        <option value="Wedding">Full Wedding</option>
                        <option value="Reception">Reception</option>
                        <option value="Engagement">Engagement</option>
                        <option value="Ceremony">Ceremony</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Event Date</label>
                    <input type="date" id="eventDate" class="form-control" required>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const user = requireAuth(['CUSTOMER']);
        const eventModal = document.getElementById('eventModal');
        const eventForm = document.getElementById('eventForm');
        let events = [];

        document.addEventListener('DOMContentLoaded', loadEvents);

        async function loadEvents() {
            showLoader();
            try {
                events = await api.get(`/events/customer/${user.id}`);
                renderEvents();
            } catch (error) {
                showToast('Failed to load events', 'error');
            } finally {
                hideLoader();
            }
        }

        function renderEvents() {
            const grid = document.getElementById('eventsGrid');
            if (events.length === 0) {
                grid.innerHTML = '<div class="card text-center" style="grid-column: 1/-1;"><p class="text-muted">You haven\'t planned any events yet. Click "Plan New Event" to start!</p></div>';
                return;
            }

            grid.innerHTML = events.map(e => {
                const isConfirmed = e.status === 'PENDING_APPROVAL' || e.status === 'CONFIRMED';
                const buttonText = isConfirmed ? 'View Inventory' : 'Find Packages';
                const buttonIcon = isConfirmed ? 'fa-eye' : 'fa-search';
                const targetUrl = isConfirmed ? `event-details.html?eventId=${e.eventId}` : `packages.html?eventId=${e.eventId}`;
                
                return `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                        <span class="badge badge-confirmed">${e.eventType || 'EVENT'}</span>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            ${statusBadge(e.status)}
                            <button onclick="deleteEvent(${e.eventId})" class="btn" style="color: var(--danger); padding: 0.2rem;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <h3 class="brand-font mb-1">${e.eventName}</h3>
                    <div style="color: var(--text-muted); font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.3rem;">
                        <span><i class="fas fa-calendar-alt"></i> ${formatDate(e.eventDate)}</span>
                        ${e.location ? `<span><i class="fas fa-map-marker-alt"></i> ${e.location}</span>` : ''}
                    </div>
                    <div class="mt-2">
                        <button onclick="window.location.href='${targetUrl}'" class="btn ${isConfirmed ? 'btn-outline' : 'btn-primary'} w-100">
                            <i class="fas ${buttonIcon}"></i> ${buttonText}
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        document.getElementById('addEventBtn').onclick = () => {
            eventForm.reset();
            document.getElementById('modalTitle').innerText = 'Plan New Event';
            // Set min date to today
            document.getElementById('eventDate').min = new Date().toISOString().split('T')[0];
            eventModal.style.display = 'flex';
        };

        function closeModal() {
            eventModal.style.display = 'none';
        }

        eventForm.onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            utils.setLoading(saveBtn, true, 'Saving...');

            const payload = {
                customerId: user.id,
                eventName: document.getElementById('eventName').value,
                eventType: document.getElementById('eventType').value,
                eventDate: document.getElementById('eventDate').value
            };

            try {
                await api.post('/events', payload);
                showToast('Event created successfully!', 'success');
                closeModal();
                loadEvents();
            } catch (error) {
                showToast(error.message || 'Failed to save event', 'error');
            } finally {
                utils.setLoading(saveBtn, false, 'Save Event');
            }
        };

        async function deleteEvent(id) {
            confirmModal('Are you sure you want to delete this event? This will not cancel existing bookings.', async () => {
                showLoader();
                try {
                    await api.delete(`/events/${id}`);
                    showToast('Event deleted', 'success');
                    loadEvents();
                } catch (error) {
                    showToast('Failed to delete event', 'error');
                } finally {
                    hideLoader();
                }
            });
        }
    </script>
</body>

</html>
